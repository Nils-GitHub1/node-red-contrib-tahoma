
name: Build and Lint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify ESLint configuration
        run: |
          echo "Current directory:"
          pwd

          echo "Git branch:"
          git branch --show-current

          echo "ESLint configuration files:"
          find . -maxdepth 2 -name 'eslint.config.*' -not -path './node_modules/*'

          echo "Tracked ESLint files:"
          git ls-files '*eslint*'

      - name: Lint the project
        run: npm run lint

      - name: Build the project
        run: npm run build
