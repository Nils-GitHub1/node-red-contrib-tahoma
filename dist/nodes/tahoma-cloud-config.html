
<script type="text/javascript">
  RED.nodes.registerType('tahoma-cloud-config', {
    category: 'config',

    defaults: {
      name: {
        value: '',
        required: true,
      },
      authMethod: {
        value: 'legacy',
        required: true,
      },
      region: {
        value: 'europe',
        required: true,
      },
      gatewayId: {
        value: '',
      },
    },

    credentials: {
      userId: {
        type: 'text',
        required: true,
      },
      userPassword: {
        type: 'password',
        required: true,
      },
      refreshToken: {
        type: 'password',
      },
      siteOid: {
        type: 'text',
      },
      gatewayId: {
        type: 'text',
      },
      region: {
        type: 'text',
      },
    },

    label: function () {
      return this.name || 'TaHoma Cloud';
    },

    oneditprepare: function () {
      const configNode = this;

      const $authMethod = $('#node-config-input-authMethod');
      const $region = $('#node-config-input-region');
      const $gateway = $('#node-config-input-gatewayId');

      let discoveredGateways = [];

      let lastSuccessfulTest = false;

      $authMethod.val(this.authMethod || 'legacy');
      $region.val(this.region || 'europe');
      $gateway.val(this.gatewayId || '');

      /**
       * Display the correct authentication fields.
       */
      function updateAuthenticationFields() {
        const method = $authMethod.val();

        if (method === 'oauth') {
          $('.tahoma-legacy-region').hide();
          $('.tahoma-oauth-info').show();
          $('.tahoma-gateway-row').show();

          $('#node-config-input-userId')
            .closest('.form-row')
            .show();

          $('#node-config-input-userPassword')
            .closest('.form-row')
            .show();

        } else {
          $('.tahoma-legacy-region').show();
          $('.tahoma-oauth-info').hide();
          $('.tahoma-gateway-row').hide();

          $('#node-config-input-userId')
            .closest('.form-row')
            .show();

          $('#node-config-input-userPassword')
            .closest('.form-row')
            .show();
        }

        $('#node-config-cloud-result').hide();
        $('#node-config-cloud-error').hide();

        lastSuccessfulTest = false;
      }

      /**
       * Show a connection error.
       */
      function showError(message) {
        $('#node-config-cloud-result').hide();

        $('#node-config-cloud-error')
          .text(message)
          .show();
      }

      /**
       * Show a successful connection.
       */
      function showSuccess(message) {
        $('#node-config-cloud-error').hide();

        $('#node-config-cloud-result')
          .text(message)
          .show();
      }

      /**
       * Populate the installation selector.
       */
      function populateGateways(gateways) {
        discoveredGateways = gateways || [];

        $gateway.empty();

        $gateway.append(
          $('<option>', {
            value: '',
            text: 'Select a Somfy installation',
          }),
        );

        discoveredGateways.forEach(function (gateway) {
          const label =
            gateway.label ||
            gateway.homeId ||
            gateway.gatewayId;

          const country = gateway.country
            ? ' (' + gateway.country + ')'
            : '';

          $gateway.append(
            $('<option>', {
              value: gateway.gatewayId,
              text: label + country + ' - ' + gateway.gatewayId,
            }),
          );
        });

        if (configNode.gatewayId) {
          $gateway.val(configNode.gatewayId);
        }

        if (!$gateway.val() && discoveredGateways.length === 1) {
          $gateway.val(discoveredGateways[0].gatewayId);
        }
      }

      /**
       * Retrieve the selected installation.
       */
      function getSelectedGateway() {
        const gatewayId = $gateway.val();

        return discoveredGateways.find(function (gateway) {
          return gateway.gatewayId === gatewayId;
        });
      }

      /**
       * Test the cloud connection.
       */
      $('#node-config-input-cloud-test')
        .off('click')
        .on('click', function () {
          const button = $(this);

          const authMethod = $authMethod.val();

          const userId = $('#node-config-input-userId').val();

          const enteredPassword = $(
            '#node-config-input-userPassword',
          ).val();

          const region = $region.val();

          const hasStoredPassword = !!(
            configNode.credentials &&
            configNode.credentials.has_userPassword
          );

          const userPassword =
            enteredPassword &&
            enteredPassword !== '__PWRD__'
              ? enteredPassword
              : '';

          if (!userId) {
            showError('Please enter your Somfy email.');
            return;
          }

          if (!userPassword && !hasStoredPassword) {
            showError('Please enter your Somfy password.');
            return;
          }

          const gatewayId =
            authMethod === 'oauth'
              ? $gateway.val()
              : '';

          button
            .prop('disabled', true)
            .text('Connecting...');

          $('#node-config-cloud-result').hide();
          $('#node-config-cloud-error').hide();

          const requestData = {
            configNodeId: configNode.id,
            authMethod: authMethod,
            userId: userId,
            userPassword: userPassword,
            region: region,
            gatewayId: gatewayId,
          };

          $.ajax({
            url:
              window.location.protocol +
              '//' +
              window.location.host +
              window.location.pathname +
              'somfy/cloud/test',

            method: 'POST',

            data: requestData,

            success: function (response) {
              if (!response.success) {
                showError(
                  response.error || 'Connection failed.',
                );
                return;
              }

              if (authMethod === 'oauth') {
                if (response.gateways) {
                  populateGateways(response.gateways);

                  if (response.gateways.length === 0) {
                    showError(
                      'No Somfy installations were found.',
                    );
                    return;
                  }

                  if (!gatewayId) {
                    if (response.gateways.length === 1) {
                      const onlyGateway =
                        response.gateways[0];

                      $gateway.val(onlyGateway.gatewayId);

                      showSuccess(
                        'Installation discovered: ' +
                        (onlyGateway.label ||
                          onlyGateway.gatewayId) +
                        '. Click Test Cloud Connection again ' +
                        'to validate it.',
                      );
                    } else {
                      showSuccess(
                        response.gateways.length +
                        ' installations found. Please select ' +
                        'one and test the connection again.',
                      );
                    }

                    return;
                  }
                }

                if (response.selectedGateway) {
                  $gateway.val(response.selectedGateway);
                }

                lastSuccessfulTest = true;

                showSuccess(
                  'OAuth connection successful! Found ' +
                  response.scenarioCount +
                  ' scenario(s).',
                );

              } else {
                lastSuccessfulTest = true;

                showSuccess(
                  'Legacy connection successful! Found ' +
                  response.scenarioCount +
                  ' scenario(s).',
                );
              }
            },

            error: function (xhr) {
              let message = 'Unknown connection error';

              if (
                xhr.responseJSON &&
                xhr.responseJSON.details
              ) {
                message = xhr.responseJSON.details;

              } else if (
                xhr.responseJSON &&
                xhr.responseJSON.error
              ) {
                message = xhr.responseJSON.error;

              } else if (xhr.statusText) {
                message = xhr.status + ' - ' + xhr.statusText;
              }

              lastSuccessfulTest = false;

              showError(
                'Connection failed: ' + message,
              );
            },

            complete: function () {
              button
                .prop('disabled', false)
                .text('Test Cloud Connection');
            },
          });
        });

      /**
       * Reset the connection-test state when the installation changes.
       */
      $gateway.on('change', function () {
        lastSuccessfulTest = false;

        $('#node-config-cloud-result').hide();
        $('#node-config-cloud-error').hide();
      });

      /**
       * Reset the connection-test state when authentication changes.
       */
      $authMethod.on('change', function () {
        updateAuthenticationFields();
      });

      updateAuthenticationFields();

      /**
       * Restore the previously saved gateway in the selector.
       */
      if (configNode.gatewayId) {
        $gateway.val(configNode.gatewayId);
      }
    },

    oneditsave: function () {
      const authMethod =
        $('#node-config-input-authMethod').val();

      const gatewayId =
        $('#node-config-input-gatewayId').val();

      this.authMethod = authMethod || 'legacy';

      this.region =
        $('#node-config-input-region').val() || 'europe';

      this.gatewayId =
        authMethod === 'oauth'
          ? gatewayId || ''
          : '';
    },
  });
</script>

<script
  type="text/html"
  data-template-name="tahoma-cloud-config"
>
  <div class="form-row">
    <label for="node-config-input-name">
      <i class="fa fa-tag"></i> Connection name
    </label>

    <input
      type="text"
      id="node-config-input-name"
      placeholder="TaHoma Cloud"
    >
  </div>

  <div class="form-row">
    <label for="node-config-input-authMethod">
      <i class="fa fa-shield"></i> Authentication
    </label>

    <select id="node-config-input-authMethod">
      <option value="legacy">
        Legacy authentication
      </option>

      <option value="oauth">
        New Somfy OAuth authentication
      </option>
    </select>
  </div>

  <div class="form-row">
    <label for="node-config-input-userId">
      <i class="fa fa-user"></i> Somfy email
    </label>

    <input
      type="text"
      id="node-config-input-userId"
      autocomplete="username"
    >
  </div>

  <div class="form-row">
    <label for="node-config-input-userPassword">
      <i class="fa fa-lock"></i> Password
    </label>

    <input
      type="password"
      id="node-config-input-userPassword"
      autocomplete="new-password"
    >
  </div>

  <div class="form-row tahoma-legacy-region">
    <label for="node-config-input-region">
      <i class="fa fa-globe"></i> Regional server
    </label>

    <select id="node-config-input-region">
      <option value="europe">Europe</option>
      <option value="america">Americas</option>
      <option value="oceania">Oceania</option>
    </select>
  </div>

  <div class="form-row tahoma-oauth-info">
    <div class="form-tips">
      <strong>New Somfy authentication</strong>

      <p>
        The new authentication method uses Somfy OAuth tokens
        and automatically discovers the installations linked
        to your Somfy account.
      </p>

      <p>
        Select an installation after discovery. Its regional
        API endpoint will be determined automatically.
      </p>

      <p>
        Your refresh token is stored securely by Node-RED.
        It is not displayed in this editor.
      </p>
    </div>
  </div>

  <div class="form-row tahoma-gateway-row">
    <label for="node-config-input-gatewayId">
      <i class="fa fa-home"></i> Installation
    </label>

    <select id="node-config-input-gatewayId">
      <option value="">
        Discover installations first
      </option>
    </select>
  </div>

  <div class="form-row">
    <button
      type="button"
      id="node-config-input-cloud-test"
      class="red-ui-button"
    >
      Test Cloud Connection
    </button>
  </div>

  <div
    id="node-config-cloud-result"
    style="
      display:none;
      color:green;
      padding:10px;
    "
  ></div>

  <div
    id="node-config-cloud-error"
    style="
      display:none;
      color:#AD1625;
      padding:10px;
    "
  ></div>

  <div class="form-tips">
    This configuration connects to your existing Somfy
    TaHoma Cloud account.

    It does not replace or modify the local TaHoma connection.

    <p>
      Legacy authentication retains the existing regional
      server and JSESSIONID login mechanism.
    </p>

    <p>
      New Somfy authentication uses OAuth and automatically
      refreshes authentication tokens.
    </p>
  </div>

  <!--
    OAuth credentials are managed by the Node-RED runtime.
    These fields are intentionally not displayed.
  -->

  <input
    type="hidden"
    id="node-config-input-refreshToken"
  >

  <input
    type="hidden"
    id="node-config-input-siteOid"
  >
</script>

<script
  type="text/html"
  data-help-name="tahoma-cloud-config"
>
  <p>
    Configuration for Somfy TaHoma Cloud scenario control.
  </p>

  <p>
    Select one of the two available authentication methods:
  </p>

  <ul>
    <li>
      <strong>Legacy:</strong>
      Uses the existing regional server and JSESSIONID login.
    </li>

    <li>
      <strong>New Somfy OAuth:</strong>
      Uses Somfy OAuth authentication, BOB installation
      discovery and automatic token refresh.
    </li>
  </ul>

  <p>
    OAuth installations are discovered automatically.
    Select the installation you want to control.
  </p>

  <p>
    Existing TaHoma scenarios remain available through
    the cloud scenario nodes.
  </p>
</script>
